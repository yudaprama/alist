name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Authenticate private deps
        env:
          DEP_TOKEN: ${{ secrets.DEP_TOKEN }}
        if: env.DEP_TOKEN != ''
        run: |
          echo "machine github.com login dielzzz89 password ${DEP_TOKEN}" >> ~/.netrc
          chmod 600 ~/.netrc
          go env -w GOPRIVATE=github.com/kawai-network/*
          go env -w GONOSUMDB=github.com/kawai-network/*

      - name: go vet
        run: go vet -printf=false -composites=false ./...

      - name: go test
        run: |
          # excluded:
          #   internal/fuse     — cgo (needs fuse.h)
          #   pkg/aria2/rpc     — needs live aria2 daemon
          #   internal/net      — TestDownloadOrder has stale chunk assertions
          #   internal/op       — panics on init: needs DB connection
          go test -vet=off \
            $(go list ./... \
              | grep -v -e /internal/fuse -e /pkg/aria2/rpc -e /internal/net -e /internal/op) \
            -count=1 -timeout=120s
